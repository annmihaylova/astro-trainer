services:
    api:
        container_name: astro-trainer-api

        build:
            context: .

        restart: unless-stopped

        init: true

        env_file:
            - .env

        environment:
            DATABASE_URL: sqlite:////data/astro_trainer.db

        ports:
            - "127.0.0.1:18080:8000"

        volumes:
            - ./data:/data

        healthcheck:
            test:
                - CMD
                - python
                - -c
                - >
                    import urllib.request;
                    urllib.request.urlopen(
                    'http://127.0.0.1:8000/health',
                    timeout=5)
            interval: 30s
            timeout: 7s
            retries: 3
            start_period: 20s